# One-time workflow for the first release (0.1.0).
#
# crates.io Trusted Publishing can only be set up for a crate that already
# exists, so the very first publish uses a short-lived crates.io token stored
# as the CARGO_REGISTRY_TOKEN repository secret. Start it by hand: Actions,
# "Publish first release", Run workflow (on main).
#
# It publishes prunecss-core, then prunecss, tags both, builds the binaries
# into a draft GitHub release, and publishes the npm packages (NPM_TOKEN
# secret, the only time a token is used for npm; see npm/publish.sh). Every step skips work that is already
# done, so a run that stopped halfway can simply be started again.
#
# Afterwards: delete the CARGO_REGISTRY_TOKEN secret and the token on
# crates.io, set up Trusted Publishing (docs/RELEASING.md), and delete this
# file and its entry in .github/zizmor.yml. Later releases go through
# release-plz.yml.
name: Publish first release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-first-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    if: github.repository_owner == 'Anikhet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release tags
    outputs:
      cli-tag: ${{ steps.version.outputs.cli-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # Installs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install --no-self-update
      - name: Read the version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cli-tag=prunecss-v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"
      # No rust-cache here: published crates must never be built from a cache
      # that some other run wrote. The library goes first because the CLI
      # depends on it; cargo waits until crates.io has indexed it.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN repository secret is not set"
            exit 1
          fi
          for crate in prunecss-core prunecss; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'prunecss-release (github.com/Anikhet/prunecss)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [ "$status" = "200" ]; then
              echo "$crate $VERSION is already on crates.io; skipping"
            else
              cargo publish -p "$crate" --locked
            fi
          done
      # Tags are created through the API so the checkout needs no stored
      # credentials. Tags made with GITHUB_TOKEN start no other workflows, so
      # the binary build below is called directly.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for tag in "prunecss-core-v$VERSION" "prunecss-v$VERSION"; do
            if gh api "repos/$REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "$tag already exists; skipping"
            else
              gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" > /dev/null
              echo "created $tag at $SHA"
            fi
          done

  binaries:
    name: Release binaries
    needs: publish
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store the attestations
    # A job-level reusable workflow is resolved by GitHub from this same commit
    # before any runner starts, so the runtime-filesystem risk behind zizmor's
    # self-repository audit does not apply here.
    uses: ./.github/workflows/release-binaries.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.publish.outputs.cli-tag }}

  # The npm packages do not exist yet, so trusted publishing cannot be set
  # up for them; this first publish uses the NPM_TOKEN secret instead.
  npm:
    name: Release npm packages
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets for publishing live in the `release` environment, which only
    # `main` may use (docs/RELEASING.md). npm trusted publishing is bound to
    # this workflow file and this environment.
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      TAG: ${{ needs.publish.outputs.cli-tag }}
    steps:
      - name: Read the version from the tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^prunecss-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::'$TAG' is not a prunecss CLI tag (expected prunecss-vX.Y.Z)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # The packaging scripts come from the commit this workflow runs on; the
      # binaries come from the tagged build (the dist-* artifacts of this run).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. Node
      # 24.22.3 ships npm 11.19.1, so no separate npm install is needed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Check the npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error("::error::npm >= 11.5.1 is required for trusted publishing"); process.exit(1) }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Assemble the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node npm/assemble.mjs --version "$VERSION" --dist dist --out npm-out
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash npm/publish.sh "$VERSION" npm-out
