[workspace]
resolver = "3"
members = ["crates/prunecss-core", "crates/prunecss-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
prunecss-core = { path = "crates/prunecss-core" }
anyhow = "1"
thiserror = "2"
rstest = "0.25"
proptest = "1"
insta = "1"
clap = { version = "4", features = ["derive"] }
# Lightning CSS has never left 1.0.0-alpha; pin exactly so upgrades are deliberate.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"

[profile.release]
lto = true
codegen-units = 1
