name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Needed if a merge queue is enabled on `main`.
  merge_group:

# The default token can write to the repository. Nothing here needs that, so
# every job gets read-only access; a compromised action cannot push code.
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous commit.
# Pushes to `main` use the commit SHA as the group, so they never cancel each
# other (every commit on `main` gets a full run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused in CI and only bloat the cache.
  CARGO_INCREMENTAL: 0

# Every action is pinned to a full commit SHA because tags can be moved.
# Dependabot keeps the SHAs (and the version comments) up to date.
# Rust is installed with the runner's own rustup rather than a toolchain
# action: one less third-party action with access to the job.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # Installs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install --no-self-update
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # Installs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only `main` writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Beta is an early warning for the next stable release, not a gate:
    # a failure there must not block merging.
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `pinned` is rust-toolchain.toml; beta warns about the next release.
        toolchain: [pinned]
        include:
          - os: ubuntu-latest
            toolchain: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (matrix toolchain)
        # bash on Windows too, so "$TOOLCHAIN" expands the same way everywhere.
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = pinned ]; then
            rustup toolchain install --no-self-update
          else
            rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
            # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
            echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Runs unit, integration and doc tests.
      - run: cargo test --locked --workspace

  msrv:
    # Must match `rust-version` in the root Cargo.toml.
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Overrides rust-toolchain.toml, so this really builds with 1.88.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (1.88)
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Broken intra-doc links and similar mistakes fail the build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # Installs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --workspace --locked

  snapshots:
    name: Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # Installs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-insta@1.49.0
      # Fails on any changed snapshot and on snapshot files no test uses any more.
      - run: cargo insta test --check --unreferenced=reject --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # Installs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-llvm-cov@0.9.2
      - name: Workspace coverage (at least 80% of lines)
        run: cargo llvm-cov --locked --workspace --fail-under-lines 80
      # prunecss-core decides which CSS gets deleted, so its own tests must
      # cover it almost completely (CLAUDE.md asks for 100% on the matching and
      # pruning logic; 95% leaves room for unreachable error plumbing).
      - name: prunecss-core coverage from its own tests (at least 95% of lines)
        run: cargo llvm-cov --locked -p prunecss-core --fail-under-lines 95

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1
      # Advisories, licences, banned crates and allowed sources (deny.toml).
      - run: cargo deny --locked check

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # Installs the toolchain pinned in rust-toolchain.toml.
          rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds the .crate files exactly as `cargo publish` would and compiles
      # them in isolation, so a missing file or bad metadata is caught here
      # instead of halfway through a release.
      - run: cargo package --workspace --locked

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: zizmor@1.33.1
      - name: zizmor (security audit of workflow files)
        # The read-only token lets zizmor's online audits check pinned SHAs
        # against known-vulnerable or impostor action commits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github
      - name: actionlint (workflow syntax and shellcheck)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # The single check that branch protection requires. Add new jobs to `needs`
  # and the ruleset never has to change when the matrix does.
  typos:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: typos@1.52.2
      # Configured in _typos.toml.
      - run: typos

  ci-success:
    name: CI success
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - msrv
      - docs
      - snapshots
      - coverage
      - deny
      - package
      - workflows
      - typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'"
              exit 1
            fi
          done
