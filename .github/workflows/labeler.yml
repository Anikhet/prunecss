name: Label pull requests

on:
  # pull_request_target so labels can be added to pull requests from forks.
  # Safe here: this workflow never checks out or runs the pull request's
  # code; actions/labeler only reads the list of changed files.
  pull_request_target: # zizmor: ignore[dangerous-triggers] labels only; no checkout, no PR code runs
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
