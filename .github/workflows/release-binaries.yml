# Builds the `prunecss` CLI for every supported platform and attaches the
# archives, SHA-256 checksums and signed build provenance to the GitHub
# release of a `prunecss-v*` tag.
#
# Normally called by release-plz.yml right after release-plz tags the CLI.
# A tag pushed by a person also triggers it, and it can be re-run by hand
# (Actions -> Release binaries -> Run workflow) for an existing tag.
name: Release binaries

on:
  push:
    tags: ["prunecss-v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to build, for example prunecss-v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example prunecss-v0.2.0
        required: true
        type: string

permissions: {}

# One build per tag at a time, never cancelled half-way through an upload. A
# second run for the same tag (say a manual re-run) waits for the first.
concurrency:
  group: release-binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate the tag
        id: tag
        env:
          # `inputs.tag` is set for workflow_call / workflow_dispatch; a pushed
          # tag arrives as the ref name.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^prunecss-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::'$TAG' is not a prunecss CLI tag (expected prunecss-vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only: every target here builds with plain
          # `cargo auditable build` and no cross-compilation container, so
          # what is built is exactly what CI tests. The two exceptions are
          # small, well-supported cross builds on the same OS.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            smoke-test: true
          # Statically linked: runs on any x86_64 Linux, including Alpine and
          # distributions with an older glibc than Ubuntu 24.04's. Pure Rust,
          # so Rust's bundled musl CRT is enough (no musl-tools needed).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            smoke-test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            smoke-test: true
          # Apple's toolchain cross-compiles to Intel out of the box. Intel
          # macOS runners are being retired, so build on Apple silicon and
          # skip running the binary.
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke-test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke-test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke-test: true
            # Link the C runtime statically so users do not need the Visual
            # C++ redistributable.
            rustflags: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          rustup default stable
      # No rust-cache: release binaries are always built from scratch so a
      # poisoned cache can never end up in a shipped artifact.
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-auditable@0.7.8
      - name: Build (dependency list embedded with cargo-auditable)
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo auditable build --release --locked -p prunecss --target "$TARGET"
      - name: Smoke test
        if: matrix.smoke-test
        run: |
          bin="target/$TARGET/release/prunecss"
          actual="$("$bin" --version)"
          echo "$actual"
          if [ "$actual" != "prunecss $VERSION" ]; then
            echo "::error::binary reports '$actual' but the tag is $TAG"
            exit 1
          fi
      - name: Package
        id: package
        run: |
          name="prunecss-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; else exe=""; fi
          cp "target/$TARGET/release/prunecss$exe" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "dist/$name/"; fi
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          rm -r "$name"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and upload
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload release assets
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation on GitHub
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      # SLSA build provenance, verifiable with
      #   gh attestation verify <archive> --repo Anikhet/prunecss
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload to the GitHub release
        run: |
          # release-plz normally creates the release; a hand-pushed tag may not
          # have one yet, so create a draft for a maintainer to fill in.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "See CHANGELOG.md for the changes in this release."
          fi
          gh release upload "$TAG" dist/* --clobber
