# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Checked in CI (`cargo deny check`) and daily by the audit workflow, so a new
# RustSec advisory against an existing dependency fails fast.
# Written against cargo-deny 0.22.1 (schema without `version = 2`, which is now
# the only schema).

[graph]
# Check every feature combination's dependencies, not just the defaults.
all-features = true
# No `targets` filter: the CLI ships for Linux, macOS and Windows, so
# platform-specific dependencies on all of them must pass too.

[output]
feature-depth = 1

[advisories]
# Vulnerabilities, unsound and unmaintained advisories are errors by default.
# A yanked crate in Cargo.lock is almost always a mistake, so deny it as well.
yanked = "deny"
# Every entry here needs a reason and, ideally, a tracking issue.
ignore = []

[licenses]
# Only licences that the current dependency tree actually needs. cargo-deny
# warns if an entry becomes unused, which keeps this list honest.
allow = [
    "Apache-2.0",
    # wasip2 / wit-bindgen (getrandom on wasm targets); permissive.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # Lightning CSS and the Servo crates it builds on (cssparser,
    # parcel_selectors, dtoa-short). MPL-2.0 is file-level copyleft: using the
    # crates unmodified in an MIT OR Apache-2.0 binary is fine; changes to
    # their own source files would have to stay MPL-2.0.
    "MPL-2.0",
    # unicode-ident's Unicode data tables.
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Workspace crates are checked like any other crate: both are published.
ignore = false

[bans]
# Duplicate versions cost compile time and binary size, but are often
# unavoidable in the short term, so warn rather than fail.
multiple-versions = "warn"
# `*` requirements make builds unreproducible for downstream users.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Keep the CLI pure Rust and trivially cross-compilable: no system OpenSSL.
    { crate = "openssl-sys", reason = "prunecss needs no TLS; avoid C dependencies" },
]
skip = []
skip-tree = []

[sources]
# Only crates.io. A git or alternative-registry dependency must be added here
# explicitly, which makes it visible in review.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
